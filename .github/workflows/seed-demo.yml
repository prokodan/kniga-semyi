name: seed-demo

# Демо-семья для питча (I12): пересоздать «Семью Ким · пример» и историю киоска — главы, сказку, книгу PDF.
# Только вручную: Actions → seed-demo → Run workflow. Ссылки и QR после сброса не меняются.
# То же самое — кнопка «Сбросить демо» в /admin и `npm run seed:demo` локально.
# #211: target=staging — база превью (секреты STAGING_SUPABASE_URL / STAGING_SUPABASE_SERVICE_ROLE_KEY), всегда без ИИ.
# Книгу PDF собирает сайт: для staging — только если задан секрет STAGING_URL и его /api/health показывает ref базы
# staging (иначе превью ещё смотрит в прод — собрать книгу там значило бы тронуть демо прода → --skip-book).
# #222: target=staging — после сида настройки ИИ staging = прод (ai_routes, ai_providers; scripts/ai-config-sync.mjs).
#   Бюджеты staging свои: вход ai_budgets → переменная репозитория STAGING_AI_BUDGETS → как сейчас в staging.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Какую базу пересеять: prod — боевая (питч), staging — база превью"
        type: choice
        options: [prod, staging]
        default: prod
      illustrate:
        description: "Нарисовать недостающие «золотые» картинки сказки через ИИ (OpenAI, ~4 картинки)"
        type: boolean
        default: false
      ai_budgets:
        description: "Только staging: бюджеты ИИ превью, $/день / $/мес — например gemini=5/10,openai=2/5; same = как в проде; пусто — переменная STAGING_AI_BUDGETS или как сейчас"
        type: string
        default: ""

concurrency:
  group: seed-demo-${{ inputs.target || 'prod' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TARGET: ${{ inputs.target || 'prod' }}
      PROD_SB_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      PROD_SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PROD_SITE: ${{ secrets.PROD_URL }}
      STG_SB_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STG_SB_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      STG_SITE: ${{ secrets.STAGING_URL }}
      LISTEN_SECRET: ${{ secrets.LISTEN_SECRET }}
      OPENAI_API_KEY: ${{ inputs.target != 'staging' && secrets.OPENAI_API_KEY || '' }}
      GEMINI_API_KEY: ${{ inputs.target != 'staging' && secrets.GEMINI_API_KEY || '' }}
      AI_MODE: ${{ (inputs.illustrate && inputs.target != 'staging') && 'auto' || 'mock' }}
    steps:
      - uses: actions/checkout@v7

      - name: Проверка секретов и выбор базы
        id: pick
        run: |
          if [ "$TARGET" = "staging" ]; then
            url="$STG_SB_URL"; key="$STG_SB_KEY"; site="$STG_SITE"; names="STAGING_SUPABASE_URL и STAGING_SUPABASE_SERVICE_ROLE_KEY"
          else
            url="$PROD_SB_URL"; key="$PROD_SB_KEY"; site="$PROD_SITE"; names="NEXT_PUBLIC_SUPABASE_URL и SUPABASE_SERVICE_ROLE_KEY"
          fi
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::Нужны секреты $names ($TARGET)"
            exit 1
          fi
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$url"
            echo "SUPABASE_SERVICE_ROLE_KEY=$key"
          } >> "$GITHUB_ENV"
          flags=""
          if [ "$TARGET" = "staging" ]; then
            [ "${{ inputs.illustrate }}" = "true" ] && echo "::notice::staging: картинки через ИИ не рисуем (платно) — illustrate пропущен"
            ref=$(printf '%s' "$url" | sed -E 's#^https?://([a-z0-9]+)\..*#\1#' | cut -c1-6)
            have=""
            if [ -n "$site" ]; then
              have=$(curl -sS --max-time 20 "${site%/}/api/health" | jq -r '.supabase_ref // empty' 2>/dev/null || true)
            fi
            if [ -n "$site" ] && [ "$have" = "$ref" ]; then
              echo "PROD_URL=$site" >> "$GITHUB_ENV"
              echo "staging: книгу соберёт $site (база $have)"
            else
              flags="--skip-book"
              echo "::notice::staging: книга PDF не собрана — ${site:+сайт смотрит в базу «${have:-?}», а staging = «$ref»}${site:-секрет STAGING_URL не задан}. Соберите позже: «Сбросить демо» в /admin превью."
            fi
          else
            [ -n "$site" ] || echo "::warning::PROD_URL не задан — QR в книге поведут на localhost"
            [ -n "$site" ] && echo "PROD_URL=$site" >> "$GITHUB_ENV"
          fi
          [ "${{ inputs.illustrate }}" = "true" ] && [ "$TARGET" != "staging" ] && flags="--illustrate"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: npm run seed:demo (${{ inputs.target || 'prod' }})
        run: npm run seed:demo -- ${{ steps.pick.outputs.flags }}

      - name: Настройки ИИ staging = прод (#222)
        if: env.TARGET == 'staging'
        env:
          STAGING_AI_BUDGETS: ${{ inputs.ai_budgets || vars.STAGING_AI_BUDGETS }}
        run: node scripts/ai-config-sync.mjs

      - name: Telegram — демо пересоздано
        if: success()
        uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: "🎭 Демо-семья пересоздана (${{ inputs.target || 'prod' }}): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Telegram — сброс демо упал
        if: failure()
        uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: "🔴 Сброс демо (${{ inputs.target || 'prod' }}) упал: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
