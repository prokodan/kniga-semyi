name: ai-models

# Подбор актуальных моделей ИИ (запуск вручную): models.list Gemini → новейшие Gemini 3.x Flash-Lite и Flash
# (без TTS/Image/Live/preview) + Transcribe, если есть → тестовый запрос к каждой → порядок в ai_routes.
# gpt-5-mini проверяется, если в Secrets есть OPENAI_API_KEY. Таблица результатов — в summary запуска.
# Роутер читает ai_routes на каждом вызове, поэтому новые модели работают сразу, без деплоя.
on:
  workflow_dispatch:
    inputs:
      write:
        description: "Записать маршруты в ai_routes (false — только проверить)"
        type: boolean
        default: true
      flash_lite_daily_limit:
        description: "Бесплатных запросов в сутки у Flash-Lite (см. AI Studio → Rate limits)"
        default: "500"
      flash_daily_limit:
        description: "Бесплатных запросов в сутки у Flash"
        default: "20"

concurrency:
  group: ai-models
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ai-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      FLASH_LITE_DAILY_LIMIT: ${{ inputs.flash_lite_daily_limit }}
      FLASH_DAILY_LIMIT: ${{ inputs.flash_daily_limit }}
      OUT_SQL: ai_routes.sql
      OUT_JSON: ai_models.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Проверка моделей
        run: node scripts/ai-models.mjs

      - name: Запись в ai_routes
        if: inputs.write
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL не задан — маршруты не записаны"
            echo "> ⚠️ SUPABASE_DB_URL не задан — маршруты **не записаны** в ai_routes" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          command -v psql > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f "$OUT_SQL" | tee routes.txt
          {
            echo "### ✅ Записано в ai_routes"
            echo '```'
            cat routes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ai-models
          path: |
            ai_models.json
            ai_routes.sql
          if-no-files-found: ignore

      # Событие в бота (I16) с учётом настроек 🔔; не ответил 200 — шлём напрямую, как раньше.
      - name: Бот — ai-models
        id: bot
        if: failure() || (success() && inputs.write)
        env:
          NOTIFY_URL: ${{ secrets.PROD_URL }}
          NOTIFY_SECRET: ${{ secrets.BOT_NOTIFY_SECRET }}
          EVENT: ai_models
          STATUS: ${{ job.status == 'success' && 'ok' || 'failed' }}
          TEXT: ${{ job.status == 'success' && '🤖 Модели ИИ проверены и записаны в ai_routes' || '🔴 ai-models упал' }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sent=false
          if [ -n "$NOTIFY_URL" ] && [ -n "$NOTIFY_SECRET" ]; then
            payload=$(jq -n --arg e "$EVENT" --arg s "$STATUS" --arg t "$TEXT" --arg u "$URL" '{event:$e, status:$s, text:$t, url:$u}')
            code=$(curl -sS --max-time 15 -o bot.json -w '%{http_code}' -X POST "${NOTIFY_URL%/}/api/telegram/notify" \
              -H "content-type: application/json" -H "x-bot-notify-secret: $NOTIFY_SECRET" --data "$payload" || true)
            echo "бот: HTTP $code $(jq -c '{delivered, reason}' bot.json 2>/dev/null || true)"
            [ "$code" = "200" ] && sent=true
          fi
          echo "sent=$sent" >> "$GITHUB_OUTPUT"

      - name: Telegram — модели обновлены
        if: success() && inputs.write && steps.bot.outputs.sent != 'true'
        uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: "🤖 Модели ИИ проверены и записаны в ai_routes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Telegram — ai-models упал
        if: failure() && steps.bot.outputs.sent != 'true'
        uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: "🔴 ai-models упал: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
