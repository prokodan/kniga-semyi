name: ai-models

# Подбор актуальных моделей ИИ (запуск вручную): models.list Gemini → новейшие Gemini 3.x Flash-Lite и Flash
# (без TTS/Image/Live/preview) + Transcribe, если есть → тестовый запрос к каждой → порядок в ai_routes.
# gpt-5-mini проверяется, если в Secrets есть OPENAI_API_KEY. Таблица результатов — в summary запуска.
# Роутер читает ai_routes на каждом вызове, поэтому новые модели работают сразу, без деплоя.
on:
  workflow_dispatch:
    inputs:
      write:
        description: "Записать маршруты в ai_routes (false — только проверить)"
        type: boolean
        default: true
      flash_lite_daily_limit:
        description: "Бесплатных запросов в сутки у Flash-Lite (см. AI Studio → Rate limits)"
        default: "500"
      flash_daily_limit:
        description: "Бесплатных запросов в сутки у Flash"
        default: "20"

concurrency:
  group: ai-models
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ai-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      FLASH_LITE_DAILY_LIMIT: ${{ inputs.flash_lite_daily_limit }}
      FLASH_DAILY_LIMIT: ${{ inputs.flash_daily_limit }}
      OUT_SQL: ai_routes.sql
      OUT_JSON: ai_models.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Проверка моделей
        run: node scripts/ai-models.mjs

      - name: Запись в ai_routes
        if: inputs.write
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL не задан — маршруты не записаны"
            echo "> ⚠️ SUPABASE_DB_URL не задан — маршруты **не записаны** в ai_routes" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          command -v psql > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f "$OUT_SQL" | tee routes.txt
          {
            echo "### ✅ Записано в ai_routes"
            echo '```'
            cat routes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ai-models
          path: |
            ai_models.json
            ai_routes.sql
          if-no-files-found: ignore

      - name: Telegram — модели обновлены
        if: success() && inputs.write
        uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: "🤖 Модели ИИ проверены и записаны в ai_routes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Telegram — ai-models упал
        if: failure()
        uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: "🔴 ai-models упал: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
