name: staging-ping

# #211: Supabase Free ставит проект на паузу примерно после 7 дней без запросов. Раз в день — один лёгкий
# запрос к базе staging (select id from families limit 1), чтобы превью не упиралось в спящую базу.
# 03:17 UTC = 08:17 Алматы. Нет секретов staging — тихо пропускаем. Упал — сообщение в Telegram.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SB_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SB_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Ping staging
        id: ping
        run: |
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then
            echo "::notice::Секретов staging нет — пропускаю"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=000
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
              "${SB_URL%/}/rest/v1/families?select=id&limit=1" || true)
            [ "$code" = "200" ] && break
            sleep 20
          done
          echo "staging: HTTP $code"
          [ "$code" = "200" ] || { echo "::error::staging не ответил 200 (HTTP $code) — проект на паузе? Supabase → Restore"; exit 1; }
      - name: Telegram — staging не отвечает
        if: failure()
        uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: "🟡 Supabase staging не ответил на ping (проект на паузе?): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
