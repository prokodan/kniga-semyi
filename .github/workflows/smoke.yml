name: smoke

# Ежедневная проверка прода: /api/health, таблицы и хранилища Supabase.
# 02:23 UTC = 07:23 Алматы. Также запускается вручную (и утром 27.11 перед питчем).
# #211: target=staging — база превью (STAGING_SUPABASE_URL / STAGING_SUPABASE_SERVICE_ROLE_KEY) и, если задан секрет
# STAGING_URL (адрес превью), его /api/health: env=preview и ref базы = staging. Расписание — только прод.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Что проверить: prod — боевой сайт и база, staging — база превью (+ STAGING_URL, если задан)"
        type: choice
        options: [prod, staging]
        default: prod
      stage:
        description: "Режим сцены на проде: on — утро 27.11 (STAGE_MODE=1), off — после питча, any — не проверять"
        type: choice
        options: [any, "on", "off"]
        default: any

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET: ${{ inputs.target || 'prod' }}
      PROD_URL: ${{ secrets.PROD_URL }}
      PROD_SB_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      PROD_SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STG_SB_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STG_SB_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      STAGING_URL: ${{ secrets.STAGING_URL }}
      EXPECT_STAGE: ${{ inputs.stage || 'any' }}
    steps:
      - uses: actions/checkout@v7

      - name: Прод /api/health
        id: health
        if: env.TARGET == 'prod'
        run: |
          # В $GITHUB_OUTPUT пишем только однострочные key=value (переводы строк вырезаем).
          out() { printf '%s=%s\n' "$1" "$(printf '%s' "$2" | tr '\r\n' '  ')" >> "$GITHUB_OUTPUT"; }

          if [ -z "$PROD_URL" ]; then
            echo "::warning::PROD_URL не задан — проверка прода пропущена"
            out summary "прод: PROD_URL не задан"
            exit 0
          fi

          url="${PROD_URL%/}/api/health"
          # Без curl --retry: на 503 он повторяет запрос и склеивает тела ответов в одну строку вывода.
          # Повторяем сами и только при сетевой ошибке (код 000); тело каждый раз перезаписывается.
          code=000
          rm -f health.json
          for i in 1 2 3; do
            code=$(curl -sS --max-time 20 -o health.json -w '%{http_code}' "$url" || true)
            [ "$code" != "000" ] && break
            sleep 5
          done

          echo "HTTP $code — ответ /api/health:"
          if jq . health.json 2>/dev/null; then :; else cat health.json 2>/dev/null; echo; fi

          if [ "$code" = "000" ]; then
            out summary "прод: недоступен ($url)"
            echo "::error::/api/health не ответил за 3 попытки: $url"
            exit 1
          fi
          if ! jq -e 'type == "object"' health.json > /dev/null 2>&1; then
            out summary "прод: HTTP $code, ответ не JSON"
            echo "::error::/api/health вернул HTTP $code и не JSON — смотри ответ выше"
            exit 1
          fi

          # Прод должен работать на этом коммите main. Сразу после слияния Vercel ещё собирает —
          # ждём до 6 минут, иначе smoke «зеленел» на предыдущей выкладке.
          want="${GITHUB_SHA:0:7}"
          for i in $(seq 1 18); do
            have=$(jq -r '.commit // "?"' health.json 2>/dev/null || echo "?")
            [ "$have" = "$want" ] && break
            echo "прод на $have, жду выкладку $want… ($i/18)"
            sleep 20
            curl -sS --max-time 20 -o health.json "$url" || true
          done
          have=$(jq -r '.commit // "?"' health.json 2>/dev/null || echo "?")
          if [ "$have" != "$want" ]; then
            out summary "прод на $have, а main — $want: выкладка не дошла"
            echo "::error::Прод работает на коммите $have, а main — $want. Проверь деплой в Vercel."
            exit 1
          fi

          status=$(jq -r '.status // "?"' health.json)
          db=$(jq -r '.db // "?"' health.json)
          mode=$(jq -r '.ai_mode // "?"' health.json)
          db_error=$(jq -r '.db_error // empty' health.json)
          stage=$(jq -r 'if .stage_mode then "on" else "off" end' health.json)
          summary="прод: $status, база: $db, ИИ: $mode, сцена: $stage"
          [ -n "$db_error" ] && summary="$summary ($db_error)"
          out summary "$summary"

          if [ "$code" != "200" ] || [ "$status" != "ok" ] || [ "$db" != "ok" ]; then
            echo "::error::Прод не здоров: HTTP $code, status=$status, db=$db${db_error:+, db_error=$db_error}"
            exit 1
          fi
          for k in admin_pin kiosk_pin; do
            [ "$(jq -r ".config.$k // false" health.json)" = "true" ] || echo "::warning::$k не задан в Vercel Env — вход выключен"
          done
          [ "$(jq -r '.config.openai_key // false' health.json)" = "true" ] || echo "::notice::OPENAI_API_KEY нет в Vercel — картинки сказки и резерв OpenAI недоступны"
          if [ "$EXPECT_STAGE" != "any" ] && [ "$stage" != "$EXPECT_STAGE" ]; then
            out summary "$summary — ждали сцену: $EXPECT_STAGE"
            echo "::error::Режим сцены $stage, а ждали $EXPECT_STAGE. Vercel → STAGE_MODE → Redeploy."
            exit 1
          fi
          echo "✓ $summary"

      - name: Staging — /api/health превью
        id: shealth
        if: env.TARGET == 'staging'
        run: |
          out() { printf '%s=%s\n' "$1" "$(printf '%s' "$2" | tr '\r\n' '  ')" >> "$GITHUB_OUTPUT"; }
          ref=$(printf '%s' "$STG_SB_URL" | sed -E 's#^https?://([a-z0-9]+)\..*#\1#' | cut -c1-6)
          if [ -z "$STAGING_URL" ]; then
            echo "::notice::STAGING_URL не задан — проверяю только базу staging (адрес превью меняется по веткам)"
            out summary "staging: база ${ref:-?}, сайт не проверялся (нет STAGING_URL)"
            exit 0
          fi
          code=$(curl -sS --max-time 20 -o health.json -w '%{http_code}' "${STAGING_URL%/}/api/health" || true)
          echo "HTTP $code"; jq . health.json 2>/dev/null || true
          if ! jq -e 'type == "object"' health.json > /dev/null 2>&1; then
            out summary "staging: $STAGING_URL — HTTP $code, не JSON (защита превью Vercel?)"
            echo "::error::/api/health превью: HTTP $code и не JSON. Если 401 — Vercel → Settings → Deployment Protection."
            exit 1
          fi
          status=$(jq -r '.status // "?"' health.json); db=$(jq -r '.db // "?"' health.json)
          envname=$(jq -r '.env // "?"' health.json); have=$(jq -r '.supabase_ref // "?"' health.json)
          sink=$(jq -r '.ai_usage_sink // "?"' health.json)
          summary="staging: $status, база: $db ($have), env: $envname, расход ИИ → прод: $sink"
          out summary "$summary"
          if [ "$code" != "200" ] || [ "$status" != "ok" ] || [ "$db" != "ok" ]; then
            echo "::error::Превью не здорово: HTTP $code, status=$status, db=$db"; exit 1
          fi
          [ "$envname" = "preview" ] || echo "::warning::STAGING_URL отвечает env=$envname, ждали preview"
          if [ -n "$ref" ] && [ "$have" != "$ref" ]; then
            echo "::warning::Превью смотрит в базу «$have», а staging — «$ref»: Preview-переменные Supabase в Vercel ещё не переключены"
          fi
          [ "$sink" = "ok" ] || echo "::notice::ai_usage_sink=off: на превью нет AI_USAGE_SECRET / PROD_URL — расход ИИ не уходит в прод"
          echo "✓ $summary"

      - name: Supabase — таблицы и хранилища
        id: db
        run: |
          if [ "$TARGET" = "staging" ]; then SUPABASE_URL="$STG_SB_URL"; SUPABASE_KEY="$STG_SB_KEY"; else SUPABASE_URL="$PROD_SB_URL"; SUPABASE_KEY="$PROD_SB_KEY"; fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            if [ "$TARGET" = "staging" ]; then
              echo "::error::Нужны секреты STAGING_SUPABASE_URL и STAGING_SUPABASE_SERVICE_ROLE_KEY"; exit 1
            fi
            echo "::warning::Секреты Supabase не заданы — проверка базы пропущена"
            exit 0
          fi
          h=(-H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          for t in families storytellers sessions stories books extras demo_orders kiosk_volunteers ai_usage ai_routes ai_providers ai_cache; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${h[@]}" "${SUPABASE_URL%/}/rest/v1/$t?select=*&limit=1")
            echo "$t: $code"; [ "$code" = "200" ]
          done
          buckets=$(curl -sS "${h[@]}" "${SUPABASE_URL%/}/storage/v1/bucket" | jq -r '[.[].id] | sort | join(",")')
          echo "buckets: $buckets"
          [ "$buckets" = "audio,books,illustrations,photos" ]
          routes=$(curl -sS "${h[@]}" "${SUPABASE_URL%/}/rest/v1/ai_routes?select=step" | jq length)
          echo "ai_routes: $routes"; [ "$routes" -ge 8 ]

      # Событие в бота (I16) с учётом настроек 🔔; не ответил 200 — шлём напрямую, как раньше.
      # Бот знает только smoke прода — staging сообщаем напрямую в Telegram (ниже)
      - name: Бот — smoke
        id: bot
        if: always() && env.TARGET == 'prod'
        env:
          NOTIFY_URL: ${{ secrets.PROD_URL }}
          NOTIFY_SECRET: ${{ secrets.BOT_NOTIFY_SECRET }}
          EVENT: smoke
          STATUS: ${{ job.status == 'success' && 'ok' || 'failed' }}
          TEXT: ${{ job.status == 'success' && format('🟢 Smoke прода ок — {0}', steps.health.outputs.summary) || format('🔴 Smoke прода упал — {0}', steps.health.outputs.summary) }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sent=false
          if [ -n "$NOTIFY_URL" ] && [ -n "$NOTIFY_SECRET" ]; then
            payload=$(jq -n --arg e "$EVENT" --arg s "$STATUS" --arg t "$TEXT" --arg u "$URL" '{event:$e, status:$s, text:$t, url:$u}')
            code=$(curl -sS --max-time 15 -o bot.json -w '%{http_code}' -X POST "${NOTIFY_URL%/}/api/telegram/notify" \
              -H "content-type: application/json" -H "x-bot-notify-secret: $NOTIFY_SECRET" --data "$payload" || true)
            echo "бот: HTTP $code $(jq -c '{delivered, reason}' bot.json 2>/dev/null || true)"
            [ "$code" = "200" ] && sent=true
          fi
          echo "sent=$sent" >> "$GITHUB_OUTPUT"

      - name: Telegram — smoke ок
        if: success() && steps.bot.outputs.sent != 'true'
        uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: "🟢 Smoke ${{ env.TARGET == 'staging' && 'staging' || 'прода' }} ок — ${{ steps.health.outputs.summary }}${{ steps.shealth.outputs.summary }}"
      - name: Telegram — smoke упал
        if: failure() && steps.bot.outputs.sent != 'true'
        uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: "🔴 Smoke ${{ env.TARGET == 'staging' && 'staging' || 'прода' }} упал — ${{ steps.health.outputs.summary }}${{ steps.shealth.outputs.summary }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
