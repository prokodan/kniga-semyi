name: diag

# Диагностика прода без персональных данных (scripts/diag.mjs): последние истории — статус, шаг, ошибка,
# попытки ИИ, длительность в базе vs размер файла, updated_at; ошибки и задержки ИИ за сутки; маршруты.
# Только вручную: Actions → diag → Run workflow. Результат — в Summary запуска и в логе.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "#211: какая база — prod или staging (база превью)"
        type: choice
        options: [prod, staging]
        default: prod
      limit:
        description: "Сколько последних историй показать"
        default: "30"
      families:
        description: "#98: связь ответ → глава по семьям — дата (2026-11-24: семьи с историями с этого дня, без демо) или короткие id через запятую; пусто — не показывать"
        default: ""

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET: ${{ inputs.target || 'prod' }}
      PROD_SB_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      PROD_SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STG_SB_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STG_SB_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      DIAG_LIMIT: ${{ inputs.limit || '30' }}
    steps:
      - uses: actions/checkout@v7
      - name: Выбор базы
        run: |
          if [ "$TARGET" = "staging" ]; then url="$STG_SB_URL"; key="$STG_SB_KEY"; else url="$PROD_SB_URL"; key="$PROD_SB_KEY"; fi
          if [ -z "$url" ] || [ -z "$key" ]; then echo "::error::Нет секретов Supabase для $TARGET"; exit 1; fi
          { echo "NEXT_PUBLIC_SUPABASE_URL=$url"; echo "SUPABASE_SERVICE_ROLE_KEY=$key"; } >> "$GITHUB_ENV"
          echo "### diag: база $TARGET" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/diag.mjs
      - if: ${{ inputs.families != '' }}
        run: node scripts/diag-family.mjs
        env:
          DIAG_FAMILIES: ${{ inputs.families }}
