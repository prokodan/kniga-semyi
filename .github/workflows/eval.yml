name: eval

# Оценка качества промптов (I11). На PR с изменениями prompts/** — прогон 3 персонажей «до» (промпты из
# базовой ветки) и «после» (промпты PR) тем же кодом → комментарий в PR с таблицей «до / после».
# Метрики: голос 1–5 (LLM-судья eval/judge.md, цель ≥ 4), потерянные / искажённые факты, уточнения,
# корейский — обратный перевод KR→RU другой моделью с флажками, время шагов. Как читать — eval/README.md.
#
# Квота: GEMINI_API_KEY из Secrets, AI_MODE=gemini (основные шаги — только Gemini, платного резерва нет), Flash-Lite
# (обратный перевод KR — Flash). #276: OPENAI_API_KEY — только для обратного перевода kk → ru другим провайдером
# (eval/kk-check.ts, chooseBackMode; ≤ KK_BACK_MAX глав персонажа ru → kk), как в kr-check. Не больше
# max_calls запросов на прогон (по умолчанию 20 × 3 персонажа × 2 = 120 максимум), а кэш ответов
# (actions/cache) делает «до» и повторы почти бесплатными. Нет ключа или PR из форка — mock, комментарий
# честно пишет «mock, оценка не показательна».
#
# #193: только вымышленные тексты (персонажи eval/personas, демо, банк). Главы живых семей в eval не попадают никогда —
# ни ko, ни kk: их проверяет Actions → repair-chapters в режиме dry run (reasons grandkids | kk-script | kk-style, без ИИ,
# в лог — id и номера абзацев). Секрет SUPABASE_DB_URL здесь — только чтобы прочитать ai_routes (модели), не главы.
on:
  pull_request:
    paths:
      - "prompts/**"
      - "eval/judge.md"
      - "eval/back_translate.md"
  workflow_dispatch:
    inputs:
      personas:
        description: "Персонажи через запятую"
        default: "kim,pak,tsoi"
      behaviors:
        description: "Профили: default (у каждого свои) или 1–2 через запятую"
        default: "default"
      questions:
        description: "Сколько основных вопросов на прогон"
        default: "4"
      max_calls:
        description: "Лимит запросов к ИИ на прогон (7–60)"
        default: "20"
      label:
        description: "Подпись прогона"
        default: ""
      fewer_calls:
        description: "#275: интервью в режиме «меньше вызовов» (#105 п. 1–2: completeness + вопрос одним вызовом)"
        type: boolean
        default: false
      review_set:
        description: "#257: имя набора для носителей (напр. 2026-11-27-ru-ko) → eval-out/sets/<имя>.json в артефакте; пусто — не писать"
        default: ""
      review_pair:
        description: "#257: пара набора"
        type: choice
        options: [ru-ko, ru-kk]
        default: ru-ko

concurrency:
  group: eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # #276: обратный перевод kk → ru — OpenAI (другой провайдер, чем перевод); основные шаги — AI_MODE=gemini ниже
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PERSONAS: ${{ inputs.personas || 'kim,pak,tsoi' }}
      BEHAVIORS: ${{ inputs.behaviors || 'default' }}
      QUESTIONS: ${{ inputs.questions || '4' }}
      MAX_CALLS: ${{ inputs.max_calls || '20' }}
      LABEL: ${{ inputs.label }}
      FEWER_CALLS: ${{ inputs.fewer_calls && '1' || '' }}
      REVIEW_SET: ${{ inputs.review_set }}
      REVIEW_PAIR: ${{ inputs.review_pair || 'ru-ko' }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      OUT: ${{ github.workspace }}/eval-out
      EVAL_ROUTES_FILE: ${{ github.workspace }}/eval-out/routes.json
      EVAL_CACHE_FILE: ${{ github.workspace }}/eval-cache/cache.json
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Режим и входы
        run: |
          mkdir -p "$OUT" eval-cache
          if ! [[ "$MAX_CALLS" =~ ^[0-9]+$ ]] || [ "$MAX_CALLS" -lt 7 ] || [ "$MAX_CALLS" -gt 60 ]; then
            echo "## 🔴 eval: max_calls должен быть числом от 7 до 60 (сейчас: $MAX_CALLS)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! [[ "$QUESTIONS" =~ ^[0-9]+$ ]]; then
            echo "## 🔴 eval: questions должен быть числом" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -n "$REVIEW_SET" ] && ! [[ "$REVIEW_SET" =~ ^[a-z0-9][a-z0-9-]{2,60}$ ]]; then
            echo "## 🔴 eval: review_set — латиница, цифры и дефис (сейчас: $REVIEW_SET)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Казахские промпты (translate.kk / translate.ru / *.kk.md) в PR — к kim, pak, tsoi добавляем serik (ru → kk),
          # иначе «до / после» RU + KZ не видно. RU + KR считается теми же персонажами, что и раньше.
          if [ "${{ github.event_name }}" = "pull_request" ] && git diff --name-only "origin/$BASE_REF...HEAD" | grep -Eq '^prompts/.*\.(kk|ru)\.md$'; then
            case ",$PERSONAS," in *,serik,*) ;; *) echo "PERSONAS=$PERSONAS,serik" >> "$GITHUB_ENV"; echo "Казахские промпты в PR → + serik" ;; esac
          fi
          # gemini, а не auto: с OPENAI_API_KEY (#276) auto пустил бы основные шаги в платный резерв OpenAI
          if [ -n "$GEMINI_API_KEY" ]; then echo "AI_MODE=gemini" >> "$GITHUB_ENV"; else echo "AI_MODE=mock" >> "$GITHUB_ENV"; fi

      - name: Модели из ai_routes прода
        if: env.SUPABASE_DB_URL != '' && env.GEMINI_API_KEY != ''
        run: |
          command -v psql > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          psql "$SUPABASE_DB_URL" -tA -v ON_ERROR_STOP=1 \
            -c "select coalesce(json_object_agg(step, providers), '{}'::json) from ai_routes" > "$EVAL_ROUTES_FILE" \
            || { echo "::warning::ai_routes не прочитаны — модели из lib/ai/config.ts"; rm -f "$EVAL_ROUTES_FILE"; }

      - name: Кэш ответов
        uses: actions/cache/restore@v5
        with:
          path: eval-cache
          key: eval-cache-${{ github.run_id }}
          restore-keys: eval-cache-

      - name: «До» — промпты базовой ветки
        if: github.event_name == 'pull_request'
        run: |
          before="$RUNNER_TEMP/before"
          mkdir -p "$before"
          git archive HEAD | tar -x -C "$before"
          rm -rf "$before/prompts"
          git archive "origin/$BASE_REF" prompts | tar -x -C "$before"
          # промпты судьи и обратного перевода (#198) — тоже из базовой ветки, иначе «до» уже судит новым судьёй
          for f in eval/judge.md eval/judge.golden.md eval/back_translate.md; do
            if git cat-file -e "origin/$BASE_REF:$f" 2>/dev/null; then git show "origin/$BASE_REF:$f" > "$before/$f"; fi
          done
          ln -s "$GITHUB_WORKSPACE/node_modules" "$before/node_modules"
          cd "$before"
          set -o pipefail
          npx tsx scripts/eval.ts --personas "$PERSONAS" --behaviors "$BEHAVIORS" --questions "$QUESTIONS" \
            --max-calls "$MAX_CALLS" --label "$BASE_REF" --out "$OUT/before.md" --json "$OUT/before.json" 2>&1 | tee "$OUT/before.log"

      - name: «После» — промпты этого коммита
        run: |
          args=(--personas "$PERSONAS" --behaviors "$BEHAVIORS" --questions "$QUESTIONS" --max-calls "$MAX_CALLS"
                --out "$OUT/report.md" --json "$OUT/report.json" --comment "$OUT/comment.md" --link "$RUN_URL")
          if [ -f "$OUT/before.json" ]; then args+=(--compare "$OUT/before.json" --label "PR #${{ github.event.pull_request.number }}"); else args+=(--label "${LABEL:-${GITHUB_REF_NAME}}"); fi
          [ -n "$FEWER_CALLS" ] && args+=(--fewer-calls)
          [ -n "$REVIEW_SET" ] && args+=(--review-set "$OUT/sets/$REVIEW_SET.json" --review-pair "$REVIEW_PAIR")
          set -o pipefail
          npx tsx scripts/eval.ts "${args[@]}" 2>&1 | tee "$OUT/after.log"

      - name: Отчёт в summary
        if: always()
        run: |
          if [ -f "$OUT/report.md" ]; then cat "$OUT/report.md" >> "$GITHUB_STEP_SUMMARY"; else echo "## 🔴 eval: отчёт не создан — см. лог" >> "$GITHUB_STEP_SUMMARY"; fi
          # Отчёт и набор для носителей (#257) — ещё и в лог: его читает агент через REST API, артефакты ему недоступны.
          # Только вымышленные тексты eval-персонажей; ключей и данных семей здесь нет.
          if [ -f "$OUT/report.md" ]; then echo "::group::report.md"; cat "$OUT/report.md"; echo "::endgroup::"; fi
          for f in "$OUT"/sets/*.json; do
            [ -f "$f" ] || continue
            echo "::group::review-set $(basename "$f")"; echo "=== REVIEW-SET-BEGIN"; cat "$f"; echo "=== REVIEW-SET-END"; echo "::endgroup::"
          done

      - name: Комментарий в PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -f "$OUT/comment.md" ] || exit 0
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" \
            --jq '[.[] | select(.body | startswith("<!-- kniga-eval -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$OUT/comment.md" > /dev/null
            echo "комментарий обновлён: $id"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$OUT/comment.md" > /dev/null
            echo "комментарий создан"
          fi

      - name: Сохранить кэш
        if: always() && hashFiles('eval-cache/cache.json') != ''
        uses: actions/cache/save@v5
        with:
          path: eval-cache
          key: eval-cache-${{ github.run_id }}

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: eval-${{ github.run_number }}
          path: |
            eval-out/
            !eval-out/routes.json
          if-no-files-found: ignore
